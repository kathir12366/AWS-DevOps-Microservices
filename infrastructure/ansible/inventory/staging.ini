[web_servers]
# Replace with actual EC2 public IP or DNS after terraform apply
# The SSH key will be automatically generated by Terraform
web-server-1 ansible_host=REPLACE_WITH_EC2_PUBLIC_IP ansible_user=ec2-user ansible_ssh_private_key_file=../../terraform/environments/staging/staging-ec2-key.pem

[staging:children]
web_servers

[staging:vars]
# Python interpreter is set in playbook
environment=staging